<!doctype html>
<html lang="en">
<head>
<script>
if (location.hostname === 'neepers-1.github.io') {
  const query = new URLSearchParams(location.search);
  if (query.get('practice') !== '1') {
    const classroom = new URL('https://quill-and-lantern.vercel.app/observer.html');
    if (query.get('login') === '1') classroom.searchParams.set('login', '1');
    if (['/teacher', '/observer'].includes(query.get('next'))) classroom.searchParams.set('next', query.get('next'));
    classroom.hash = location.hash;
    location.replace(classroom.href);
  }
}
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a29"><meta name="robots" content="noindex,nofollow">
<title>The Story Wall · Quill &amp; Lantern</title>
<link rel="icon" href="./favicon.svg"><link rel="preload" href="./fonts/manuscript.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="./observer.css"><link rel="stylesheet" href="./wall-stars.css">
</head>
<body>
<div id="landscape" aria-hidden="true"><div class="lamplight"></div><div id="motes"></div></div>
<header><div class="brand"><span id="mark"></span><span>Quill <i>&amp;</i> Lantern</span></div>
<div class="title"><span class="rule" aria-hidden="true"></span><h1>The Story Wall</h1><span class="rule" aria-hidden="true"></span></div>
<nav aria-label="Display controls"><button id="fullscreen" title="Full screen" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg></button><button id="leave" hidden>Sign out</button></nav></header>
<main><section id="wall" aria-label="Shared student stories"></section>
<section id="message" role="status"><div class="empty-mark" aria-hidden="true"></div><h2>Opening the story wall…</h2><p></p><a id="enter" href="./?login=1&amp;next=/observer" hidden>Sign in</a></section></main>
<div id="connection" role="status"></div>
<script type="module" src="./observer.js"></script>
</body></html>
